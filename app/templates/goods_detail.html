{% extends "base.html" %}
{% block title %}{{ g['name'] }} - Demo Mall{% endblock %}
{% block content %}
<div class="goods-detail" id="goods-detail" data-goods-id="{{ g['id'] }}">
  <h2 id="detail-name">{{ g['name'] }}</h2>
  <p>分类：<span id="detail-category">{{ g['category'] }}</span></p>
  <p>价格：<span id="detail-price" class="goods-price">{{ '%.2f'|format(g['price']) }}</span> 元</p>
  <p>库存：<span id="detail-stock">{{ g['stock'] }}</span> 件</p>
  <p id="detail-description">{{ g['description'] }}</p>

  <form method="post" action="{{ url_for('web.cart_add') }}" id="add-cart-form">
    <input type="hidden" name="goods_id" value="{{ g['id'] }}">
    <label for="buy-quantity">数量</label>
    <input type="number" id="buy-quantity" name="quantity" value="1" min="1" max="{{ g['stock'] }}">
    <button type="submit" id="btn-add-cart">加入购物车</button>
  </form>
  <p><a href="{{ url_for('web.goods_page') }}" id="link-back">← 返回商品列表</a></p>
</div>
{% endblock %}
