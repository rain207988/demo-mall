<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Demo Mall{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header id="navbar">
    <span class="brand">Demo Mall</span>
    <nav>
      <a href="{{ url_for('web.goods_page') }}" id="nav-goods">商品</a>
      {% if user %}
        <a href="{{ url_for('web.cart_page') }}" id="nav-cart">购物车</a>
        <a href="{{ url_for('web.orders_page') }}" id="nav-orders">我的订单</a>
        <span id="nav-user">你好，{{ user['nickname'] }}</span>
        <form method="post" action="{{ url_for('web.logout') }}" class="inline-form">
          <button type="submit" id="btn-logout">退出登录</button>
        </form>
      {% else %}
        <a href="{{ url_for('web.login_page') }}" id="nav-login">登录</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div id="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
